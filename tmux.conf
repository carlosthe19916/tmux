# Enable Colours
set -g default-terminal 'xterm-256color'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

# Enable Mouse
set -g mouse on

# Open new windows in current directory path
bind c new-window -c "#{pane_current_path}"

# Open new panes in the directory the pane originally started in
bind '"' split-window -v -c "#{pane_start_path}"
bind % split-window -h -c "#{pane_start_path}"

# Resize Panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# Scrollback
set -g history-limit 50000

# VIM motions
set-window-option -g mode-keys vi                                                              bind-key -T copy-mode-vi 'v' send -X begin-selection                                           bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -selection clipboard"

# Enable Mouse Dragging
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status Line Position
set-option -g status-position top

# Two-row status: info on row 0, window list on its own row.
# Clicks still switch windows because each entry keeps its
# #[range=window|<index>] marker (used by the default
# MouseDown1Status -> select-window -t= binding).
set -g status 2
set -g 'status-format[0]' '#[align=left]#{T;=/#{status-left-length}:status-left}#[align=right]#{T;=/#{status-right-length}:status-right}'
set -g 'status-format[1]' '#[align=centre]#{W:#[range=window|#{window_index}]#[fg=black bg=green] #{window_index}:#{window_name} #[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus]#[fg=green bg=black bold] #{window_index}:#{window_name} #[norange default]#{?loop_last_flag,,#{E:window-status-separator}}}'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'crhistoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Auto Save / Restore
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Neovim CheckHealth recommendations
set-option -sg escape-time 10
set-option -g focus-events on

# TPM init
run '~/.tmux/plugins/tpm/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
